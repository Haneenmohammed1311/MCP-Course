[project]
name = "mcp-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Haneen Mohammed", email = "haneeenmohammid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp<4",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.17",
    "langgraph-prebuilt>=1.1.1",
    "mcp<2",
    "mcp-server>=0.1.4",
    "node>=2.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-course = "mcp_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
